services:
  postgres:
    image: postgres:16
    container_name: clinica-pg
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-migrator_dev_only}
      POSTGRES_DB: clinica
    volumes:
      - clinica_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d clinica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinica_pg_data:
